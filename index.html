<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="水下珞珈：以武汉大学校园空间、建筑与文化记忆为核心的高精度连续校园数字重建项目。"
    />
    <title>水下珞珈 · Sunken Luojia V2</title>
  </head>
  <body>
    <div id="app">
      <main id="viewport" aria-label="武汉大学水下数字重建连续校园三维视图"></main>

      <header class="topbar">
        <div>
          <p class="eyebrow">ONE CONTINUOUS WUHAN UNIVERSITY WORLD</p>
          <h1>水下珞珈 <span>Sunken Luojia</span></h1>
          <p class="subtitle">同一坐标系、同一地形、同一道路网络的完整校园底座 · V2 Alpha</p>
        </div>
        <div id="dataset-status" class="status">正在读取完整校园总图…</div>
      </header>

      <aside class="sidebar" aria-label="校园地点目录">
        <div class="sidebar-heading">
          <h2>完整校园建设目录</h2>
          <p>目录用于定位同一张大地图里的地点，不会进入独立空间。当前坐标仍需用地图、照片或测量资料核验。</p>
        </div>
        <div id="place-list" class="place-list"></div>
      </aside>

      <section id="place-detail" class="detail-card" aria-live="polite">
        <p class="detail-kicker">WHOLE CAMPUS WORLD</p>
        <h2>正在建立完整武汉大学</h2>
        <p>所有地形、道路、建筑、操场和岸线将位于同一个连续世界中。</p>
      </section>

      <footer class="notice">
        独立学生创作项目，非武汉大学官方产品。分区只用于后台加载，不代表独立关卡。
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
