<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="水下珞珈：以武汉大学校园空间、建筑与文化记忆为核心的高精度水下数字重建项目。"
    />
    <title>水下珞珈 · Sunken Luojia V2</title>
  </head>
  <body>
    <div id="app">
      <main id="viewport" aria-label="武汉大学水下数字重建三维视图"></main>

      <header class="topbar">
        <div>
          <p class="eyebrow">WUHAN UNIVERSITY RECONSTRUCTION</p>
          <h1>水下珞珈 <span>Sunken Luojia</span></h1>
          <p class="subtitle">完整度与精度优先的校园数字重建底座 · V2 Alpha</p>
        </div>
        <div id="dataset-status" class="status">正在读取校园数据…</div>
      </header>

      <aside class="sidebar" aria-label="校园地点目录">
        <div class="sidebar-heading">
          <h2>校园重建目录</h2>
          <p>当前坐标为工程占位，必须经地图、照片或测量资料核验后才能标记为准确。</p>
        </div>
        <div id="place-list" class="place-list"></div>
      </aside>

      <section id="place-detail" class="detail-card" aria-live="polite">
        <p class="detail-kicker">数据化重建底座</p>
        <h2>选择一个校园地点</h2>
        <p>点击左侧目录或场景占位体，查看精度、来源与建模状态。</p>
      </section>

      <footer class="notice">
        独立学生创作项目，非武汉大学官方产品。旧版程序化场景仍保留在仓库中。
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
